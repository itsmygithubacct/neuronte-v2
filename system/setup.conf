# Settings of neuronte-setup: lines of key=value. This file is read, never
# run. Each line below shows the value used when the key is absent.

# The directory of weight files (*.nrt). Every font file and cache is made
# from what is there, and made again when a file there changes.
#weights=/usr/share/neuronte/weights

# Where the steps keep what they make (fonts/ for the font files) and their
# stamps. The fontconfig file 66-neuronte.conf names fonts/ under this
# directory: change both together.
#state=/var/lib/neuronte

# Threads a step may use. It changes how long a step takes, never a byte
# of what it writes. More than the machine has cores does no harm.
#threads=4

# The steps that "neuronte-setup --early" runs: what must be there before
# a login screen starts. The rest are run afterwards, in the background.
# A step named here that is not installed is skipped. No font step is
# early as shipped: the login screen does not wait for the font files, and
# until they are made it draws with the other fonts installed. A machine
# with no other font at all names the Sans step here too:
# early=10-backend,20-fontfile-sans
#early=10-backend

# Steps never to run, separated by commas.
#skip=

# How many seconds one step may take while a login screen waits for it
# (the early unit sets NEURONTE_SETUP_BOOT=1). A step whose work may take
# longer defers it to the run after the start; one that overruns is stopped.
#boot_limit=60

# The cells step (30-cells): which characters are drawn at setup and kept
# in /var/lib/neuronte/cells for every process to map. docs/neuronte-cells.md.
# The cells, as WIDTHxHEIGHT in pixels. The default is what the two
# terminals ask for at 9 to 15 point; give this machine's own if its
# terminal's cell is another (the terminal's font size and the display's
# dots to the inch decide it).
#cells=7x14,8x16,8x17,9x18,10x19,10x20,11x22,12x24
# The characters: ascii, latin1, all, none, or scalars and ranges in
# hexadecimal (2500-257F), with commas between. Only those a bundle is
# trained on are drawn.
#cells_chars=latin1
# The styles: regular, bold, italic, bolditalic.
#cells_styles=regular,bold,italic,bolditalic
# The status marks: characters a terminal's bars and tab titles show in one
# cell that are in no font of Kilix's. Every terminal bundle draws those of
# them it is trained on, in the regular style, at the cells below, on top
# of the characters above. As shipped: the idle dot (U+2022, U+25CF), the
# sun and the cloud (U+2600, U+2601) and the eight moons. none for no marks.
#cells_marks=2022,25CF,2600,2601,1F311-1F318
#cells_marks_cells=8x17,9x18,10x19,10x20,12x24
# Each of the five for one bundle alone: the key, a full stop, and the
# weight file's name without .nrt. This also gives a cells file to a weight
# file that would have none.
#cells_chars.neuronte-term-symbol-v1=2190-21FF,25A0-25FF
