<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Neuronte Sans and Neuronte Mono: the last choice for the generic families; Neuronte Sans Metric for Arial and Helvetica</description>

  <!-- Where the font steps of neuronte-setup write the files: fonts/ under
       state= of /etc/neuronte/setup.conf. -->
  <dir>/var/lib/neuronte/fonts</dir>

  <!-- "default" adds a family at the end of the list a program asked for,
       weakly bound. Every family named before it, by the program, by the
       user's own configuration or by the distribution's lists, is tried
       first, so these faces answer only when none of those is installed.
       There is no Neuronte serif: serif text gets the sans. -->
  <!-- Neuronte Sans Metric has the advances of Helvetica, which are
       Arial's: a page laid out for those fonts keeps its line breaks. It
       is added weakly, at the end, for a program that asks for one of the
       four families below, so an installed Arial, Helvetica, Liberation
       Sans or Arimo, and every family fontconfig would give in their place,
       is still chosen first. These rules come before the generic ones, so
       the Metric face is tried before Neuronte Sans. "same" binds it as the
       family asked for is bound. -->
  <alias binding="same">
    <family>Arial</family>
    <default><family>Neuronte Sans Metric</family></default>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <default><family>Neuronte Sans Metric</family></default>
  </alias>
  <alias binding="same">
    <family>Liberation Sans</family>
    <default><family>Neuronte Sans Metric</family></default>
  </alias>
  <alias binding="same">
    <family>Arimo</family>
    <default><family>Neuronte Sans Metric</family></default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <default><family>Neuronte Sans</family></default>
  </alias>
  <alias>
    <family>serif</family>
    <default><family>Neuronte Sans</family></default>
  </alias>
  <alias>
    <family>system-ui</family>
    <default><family>Neuronte Sans</family></default>
  </alias>
  <alias>
    <family>monospace</family>
    <default><family>Neuronte Mono</family></default>
  </alias>

  <!-- The files carry the nets' own pixels as embedded bitmaps for the
       small sizes, and outlines with no hinting instructions. Use the
       bitmaps, and do not let an automatic hinter redraw the outlines. -->
  <match target="font">
    <test name="family" compare="eq" qual="any"><string>Neuronte Sans</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq" qual="any"><string>Neuronte Sans Metric</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq" qual="any"><string>Neuronte Mono</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
